<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾音塔羅｜抽一張牌</title>
  <style>
    :root{
      --ink:#514660;
      --muted:#7f728d;
      --white:rgba(255,255,255,.92);
      --glass:rgba(255,255,255,.48);
      --glass-strong:rgba(255,255,255,.72);
      --line:rgba(255,255,255,.68);
      --purple:#b8a7df;
      --pink:#efbed7;
      --blue:#b8d6ee;
      --shadow:0 22px 60px rgba(83,66,104,.16);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:
        -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC",
        "Microsoft JhengHei", sans-serif;
      color:var(--ink);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(255,205,229,.75), transparent 31%),
        radial-gradient(circle at 82% 12%, rgba(191,214,250,.8), transparent 32%),
        radial-gradient(circle at 46% 76%, rgba(205,190,244,.82), transparent 36%),
        linear-gradient(145deg, #f9eef7 0%, #eeeafb 38%, #e9f2fc 70%, #f8edf5 100%);
      background-attachment:fixed;
    }

    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(110deg, rgba(255,255,255,.25), rgba(255,255,255,0) 35%),
        radial-gradient(circle at 60% 35%, rgba(255,255,255,.28), transparent 35%);
      z-index:0;
    }

    #snow{
      position:fixed;
      inset:0;
      overflow:hidden;
      pointer-events:none;
      z-index:1;
    }

    .snowflake{
      position:absolute;
      top:-30px;
      border-radius:999px;
      background:rgba(255,255,255,.78);
      filter:blur(.15px);
      animation:fall linear infinite;
      box-shadow:0 0 14px rgba(255,255,255,.55);
    }

    @keyframes fall{
      0%{transform:translate3d(0,-5vh,0);opacity:0}
      10%{opacity:.9}
      50%{transform:translate3d(var(--drift),50vh,0)}
      100%{transform:translate3d(calc(var(--drift) * -0.35),110vh,0);opacity:.15}
    }

    .page{
      position:relative;
      z-index:2;
      width:min(1120px, calc(100% - 32px));
      margin:0 auto;
      padding:54px 0 70px;
    }

    .hero{
      text-align:center;
      margin-bottom:34px;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:9px;
      padding:8px 14px;
      border:1px solid rgba(255,255,255,.78);
      border-radius:999px;
      background:rgba(255,255,255,.42);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      box-shadow:0 8px 30px rgba(93,76,115,.08);
      font-size:13px;
      letter-spacing:.12em;
      color:#7b6f88;
      margin-bottom:16px;
    }

    .hero h1{
      margin:0;
      font-family:"Noto Serif TC", "Songti TC", "PMingLiU", serif;
      font-size:clamp(27px, 3.6vw, 40px);
      line-height:1.5;
      letter-spacing:.08em;
      font-weight:600;
      color:#665273;
      text-wrap:balance;
      text-shadow:0 1px 12px rgba(255,255,255,.45);
    }

    .hero h1::after{
      content:"";
      display:block;
      width:64px;
      height:1px;
      margin:16px auto 0;
      background:linear-gradient(90deg, transparent, rgba(156,125,170,.5), transparent);
    }

    .hero-intro{
      display:grid;
      gap:9px;
      margin:19px auto 0;
      max-width:760px;
    }

    .hero p{
      margin:0;
      line-height:1.9;
      color:#796d86;
      font-size:14px;
      font-weight:500;
      letter-spacing:.045em;
    }

    .intro-phrase{
      display:inline-block;
    }

    .deck{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:28px;
      align-items:start;
      margin:38px auto 18px;
      max-width:980px;
    }

    .card-wrap{
      text-align:center;
      perspective:1200px;
      position:relative;
    }

    .pick-label{
      margin-bottom:12px;
      font-size:13px;
      letter-spacing:.18em;
      color:#8f819d;
      transition:.3s ease;
    }

    .tarot-card{
      width:100%;
      max-width:245px;
      /* 未翻牌高度由上一版的 360px 加倍為 720px。 */
      height:720px;
      display:block;
      appearance:none;
      -webkit-appearance:none;
      padding:0;
      border:0;
      background:transparent;
      color:inherit;
      font:inherit;
      text-align:center;
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      margin:0 auto;
      cursor:pointer;
      position:relative;
      transition:transform .25s ease, max-width .35s ease;
      outline:none;
      border-radius:24px;
    }

    @media (hover:hover) and (pointer:fine){
      .tarot-card:hover:not(.flipped){
        transform:translateY(-8px);
      }
    }

    .tarot-card:focus-visible{
      box-shadow:0 0 0 4px rgba(255,255,255,.75),0 0 0 8px rgba(160,137,192,.28);
    }

    /* 按鈕本身保持穩定的點按區域，僅內層進行翻牌。 */
    .card-inner{
      position:absolute;
      inset:0;
      display:block;
      transform-style:preserve-3d;
      -webkit-transform-style:preserve-3d;
      transition:transform .8s cubic-bezier(.2,.78,.24,1);
      pointer-events:none;
    }

    .tarot-card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-face{
      position:absolute;
      inset:0;
      border-radius:24px;
      overflow:hidden;
      backface-visibility:hidden;
      -webkit-backface-visibility:hidden;
      box-shadow:var(--shadow);
      border:1px solid rgba(255,255,255,.78);
    }

    .card-back{
      background:
        radial-gradient(circle at 20% 16%, rgba(255,255,255,.32) 0 4%, transparent 5%),
        radial-gradient(circle at 76% 78%, rgba(255,255,255,.22) 0 4%, transparent 5%),
        linear-gradient(155deg, rgba(183,156,219,.92), rgba(225,173,207,.85) 42%, rgba(157,192,227,.92));
      display:flex;
      align-items:center;
      justify-content:center;
      transform:translateZ(1px);
    }

    .card-back::before{
      content:"";
      position:absolute;
      inset:12px;
      border:1px solid rgba(255,255,255,.62);
      border-radius:18px;
    }

    .card-back::after{
      content:"";
      position:absolute;
      inset:24px;
      border:1px solid rgba(255,255,255,.38);
      border-radius:14px;
    }

    .sigil{
      width:118px;
      height:118px;
      border:1px solid rgba(255,255,255,.64);
      border-radius:50%;
      display:grid;
      place-items:center;
      position:relative;
      color:rgba(255,255,255,.96);
      font-family:Georgia, serif;
      font-size:46px;
      text-shadow:0 4px 18px rgba(81,70,95,.15);
    }

    .sigil::before,
    .sigil::after{
      content:"";
      position:absolute;
      width:82px;
      height:82px;
      border:1px solid rgba(255,255,255,.45);
      transform:rotate(45deg);
      border-radius:12px;
    }

    .sigil::after{
      width:54px;
      height:54px;
      transform:rotate(22.5deg);
    }

    .card-front{
      transform:rotateY(180deg) translateZ(1px);
      background:
        linear-gradient(rgba(255,255,255,.42), rgba(255,255,255,.78)),
        radial-gradient(circle at 25% 20%, rgba(247,196,223,.72), transparent 34%),
        radial-gradient(circle at 70% 75%, rgba(183,211,244,.75), transparent 35%),
        #f5f0fa;
      padding:16px;
      display:flex;
      align-items:stretch;
    }

    .front-inner{
      width:100%;
      border:1px solid rgba(118,96,142,.22);
      border-radius:16px;
      padding:18px 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      background:rgba(255,255,255,.24);
    }

    .front-top{
      font-size:11px;
      letter-spacing:.22em;
      color:#9485a0;
    }

    .front-symbol{
      width:116px;
      height:116px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.42);
      border:1px solid rgba(134,112,158,.18);
      font-size:52px;
      box-shadow:inset 0 0 24px rgba(255,255,255,.38);
    }

    .front-title{
      font-family:Georgia, "Noto Serif TC", serif;
      font-size:23px;
      letter-spacing:.08em;
      color:#61536d;
    }

    .front-sub{
      font-size:12px;
      color:#97899f;
      line-height:1.7;
    }

    .selected-badge{
      position:absolute;
      top:14px;
      right:14px;
      width:30px;
      height:30px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.78);
      color:#776789;
      font-size:12px;
      z-index:5;
      opacity:0;
      transform:scale(.8);
      transition:.3s ease .35s;
      box-shadow:0 8px 22px rgba(91,71,112,.1);
    }

    .tarot-card.flipped .selected-badge{
      opacity:1;
      transform:scale(1);
    }

    .deck.has-selection .card-wrap:not(.is-selected){
      opacity:.5;
      filter:saturate(.7);
      transform:scale(.98);
      transition:.35s ease;
    }

    .deck.has-selection .card-wrap:not(.is-selected) .tarot-card{
      cursor:default;
    }

    .result{
      width:min(820px, 100%);
      margin:34px auto 0;
      display:none;
      opacity:0;
      transform:translateY(18px);
    }

    .result.show{
      display:block;
      animation:resultIn .65s ease .45s forwards;
    }

    @keyframes resultIn{
      to{opacity:1;transform:translateY(0)}
    }

    .glass{
      background:var(--glass);
      border:1px solid var(--line);
      border-radius:28px;
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      box-shadow:var(--shadow);
    }

    .reading{
      padding:30px 30px 28px;
    }

    .section-kicker{
      margin:0 0 8px;
      font-size:12px;
      letter-spacing:.18em;
      color:#978aa2;
    }

    .reading h2,
    .candle h3{
      margin:0;
      color:#56495f;
      font-weight:700;
    }

    .reading h2{
      font-size:23px;
    }

    .reading p{
      margin:16px 0 0;
      color:#6f627b;
      font-size:15px;
      line-height:2;
    }

    .candle{
      margin-top:18px;
      padding:22px;
      display:grid;
      grid-template-columns:108px 1fr;
      gap:20px;
      align-items:center;
      background:rgba(255,255,255,.56);
      border:1px solid rgba(255,255,255,.78);
      border-radius:22px;
    }

    .candle h3{
      font-size:18px;
    }

    .candle p{
      margin:7px 0 0;
      line-height:1.8;
      font-size:14px;
      color:#776b81;
    }

    .actions{
      display:flex;
      justify-content:center;
      margin-top:26px;
    }

    button.reset{
      appearance:none;
      border:1px solid rgba(255,255,255,.78);
      color:#5f526c;
      background:rgba(255,255,255,.62);
      padding:13px 26px;
      border-radius:999px;
      font-size:15px;
      cursor:pointer;
      box-shadow:0 10px 28px rgba(81,68,101,.11);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      transition:.25s ease;
    }

    button.reset:hover{
      transform:translateY(-2px);
      background:rgba(255,255,255,.82);
      box-shadow:0 14px 34px rgba(81,68,101,.15);
    }

    .hint{
      text-align:center;
      margin-top:14px;
      font-size:12px;
      color:#9a8ca4;
    }

    footer{
      margin-top:54px;
      text-align:center;
      color:#9b8fa4;
      font-size:12px;
      letter-spacing:.08em;
    }


    .brand-badge{
      padding:7px 14px 7px 8px;
      gap:10px;
      font-size:14px;
      font-weight:600;
      letter-spacing:.08em;
    }

    .brand-logo{
      width:38px;
      height:38px;
      display:block;
      border-radius:50%;
      clip-path:circle(49% at 50% 50%);
      object-fit:cover;
      border:none;
      outline:none;
      box-shadow:0 5px 16px rgba(183,120,170,.18);
      background:transparent;
    }

    .deck.has-selection{
      grid-template-columns:1fr;
      max-width:320px;
      transition:max-width .45s ease;
    }

    .deck.has-selection .card-wrap:not(.is-selected){
      display:none;
    }

    .deck.has-selection .card-wrap.is-selected{
      width:100%;
      margin:0 auto;
      opacity:1;
      filter:none;
      transform:none;
    }

    .deck.has-selection .card-wrap.is-selected .tarot-card{
      max-width:245px;
      height:auto;
    }

    /* 用比例留白支援尚未提供 aspect-ratio 的手機瀏覽器。 */
    .deck.has-selection .tarot-card::before{
      content:"";
      display:block;
      padding-top:178.5714286%;
    }

    .appointment{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      text-decoration:none;
      border:1px solid rgba(255,255,255,.84);
      color:#fff;
      background:linear-gradient(135deg, rgba(183,151,220,.96), rgba(231,167,207,.96), rgba(147,190,226,.96));
      padding:14px 27px;
      border-radius:999px;
      font-size:15px;
      font-weight:650;
      letter-spacing:.03em;
      cursor:pointer;
      box-shadow:0 12px 30px rgba(96,73,117,.16);
      transition:.25s ease;
    }

    .appointment:hover{
      transform:translateY(-2px);
      box-shadow:0 16px 36px rgba(96,73,117,.22);
    }

    .reading-note{
      width:min(650px, 100%);
      margin:20px auto 0;
      padding:0 12px;
      color:#82718e;
      font-size:12px;
      line-height:1.9;
      letter-spacing:.02em;
      text-align:center;
    }

    .reading-note strong{
      font-weight:600;
    }

    .appointment-wrap{
      display:flex;
      justify-content:center;
      margin-top:14px;
    }

    .appointment-wrap{
      margin-top:28px;
    }

    .appointment{
      width:min(520px, 100%);
      min-height:76px;
      padding:14px 20px;
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:14px;
      border-radius:22px;
      text-align:left;
      background:
        linear-gradient(135deg, rgba(174,143,219,.98), rgba(235,168,208,.98) 52%, rgba(145,190,228,.98));
      box-shadow:
        0 18px 42px rgba(102,78,124,.20),
        inset 0 1px 0 rgba(255,255,255,.45);
    }

    .appointment-icon{
      width:38px;
      height:38px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:rgba(255,255,255,.20);
      border:1px solid rgba(255,255,255,.42);
      font-size:16px;
    }

    .appointment-copy{
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .appointment-copy strong{
      font-size:17px;
      line-height:1.2;
      letter-spacing:.03em;
      color:#fff;
    }

    .appointment-copy small{
      font-size:12px;
      line-height:1.45;
      color:rgba(255,255,255,.82);
      font-weight:400;
      letter-spacing:.015em;
    }

    .appointment-arrow{
      font-size:20px;
      color:rgba(255,255,255,.92);
      transition:transform .22s ease;
    }

    .appointment:hover .appointment-arrow{
      transform:translateX(3px);
    }

    .actions{
      margin-top:12px;
    }

    button.reset{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 13px;
      min-height:34px;
      border-radius:999px;
      font-size:12px;
      color:#796c85;
      background:rgba(255,255,255,.34);
      border:1px solid rgba(255,255,255,.62);
      box-shadow:none;
    }

    button.reset:hover{
      transform:translateY(-1px);
      background:rgba(255,255,255,.58);
      box-shadow:none;
    }

    .reset-icon{
      font-size:14px;
      line-height:1;
    }


    /* ===== v4 refinements ===== */

    .deck.has-selection .card-wrap.is-selected{
      animation:selectedSettle .48s ease both;
    }

    @keyframes selectedSettle{
      from{transform:scale(.98)}
      to{transform:scale(1)}
    }


    /* 細長橢圓品牌標籤：霧面珠光、細邊框與留白。 */
    .brand-badge{
      position:relative;
      min-width:218px;
      justify-content:center;
      padding:4px 22px;
      gap:13px;
      border:0.5px solid rgba(155,130,174,.34);
      background:linear-gradient(115deg, rgba(255,255,255,.58), rgba(253,246,253,.30) 55%, rgba(238,241,253,.48));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.85),
        0 5px 18px rgba(87,69,105,.06);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
    }

    .brand-badge::after{
      content:"";
      position:absolute;
      inset:2px;
      border-radius:999px;
      border:0.5px solid rgba(255,255,255,.42);
      pointer-events:none;
    }

    .brand-logo{
      width:28px;
      height:28px;
      flex-shrink:0;
      box-shadow:0 2px 8px rgba(183,120,170,.12);
    }

    .brand-name{
      padding-left:13px;
      border-left:0.5px solid rgba(155,130,174,.26);
      font-family:"Noto Serif TC", "Songti TC", "PMingLiU", serif;
      font-weight:500;
      line-height:1.2;
      letter-spacing:.24em;
      white-space:nowrap;
      color:#71607e;
    }

    .brand-mark{
      width:13px;
      height:13px;
      flex-shrink:0;
      color:#b39abb;
    }

    /* 蠟燭推薦改成純文字 */
    .candle{
      position:relative;
      display:block;
      padding:24px 22px 21px;
      text-align:left;
      background:rgba(255,255,255,.52);
    }

    .candle-recommend-label{
      position:absolute;
      top:13px;
      left:17px;
      font-size:11px;
      letter-spacing:.08em;
      color:#988aa2;
    }

    .candle-content{
      padding-top:16px;
    }

    .candle-content h3{
      margin-top:3px;
      font-size:19px;
    }

    .candle-heading{
      display:flex;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }

    .candle-title-deco{
      width:68px;
      height:26px;
      flex-shrink:0;
      color:#aa8bb6;
      opacity:.85;
    }

    .candle-content p{
      margin-top:8px;
    }

    /* 桌面保持三張並排 */
    .deck{
      align-items:start;
    }


    /* 蠟燭推薦：加入低調小圖案與層次 */
    .candle{
      overflow:hidden;
      background:
        radial-gradient(circle at 92% 12%, rgba(207,190,240,.16), transparent 28%),
        radial-gradient(circle at 8% 92%, rgba(242,198,220,.14), transparent 26%),
        rgba(255,255,255,.52);
      border:0.7px solid rgba(255,255,255,.78);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.42),
        0 12px 30px rgba(87,69,105,.07);
    }

    .candle::after{
      content:"";
      position:absolute;
      left:17px;
      right:17px;
      top:40px;
      height:0.6px;
      background:linear-gradient(
        90deg,
        rgba(145,124,164,0),
        rgba(145,124,164,.18) 20%,
        rgba(145,124,164,.18) 80%,
        rgba(145,124,164,0)
      );
    }

    .candle-recommend-label{
      display:flex;
      align-items:center;
      gap:4px;
      color:#8f809b;
      font-weight:500;
    }

    .candle-recommend-label span{
      font-size:10px;
      color:#b39ac4;
    }

    .candle-deco{
      position:absolute;
      pointer-events:none;
      color:rgba(163,139,183,.22);
      line-height:1;
      z-index:0;
    }

    .candle-deco-left{
      left:13px;
      bottom:12px;
      font-size:24px;
      transform:rotate(-8deg);
    }

    .candle-deco-right{
      right:14px;
      top:11px;
      font-size:26px;
      transform:rotate(10deg);
    }

    .candle-spark{
      position:absolute;
      width:5px;
      height:5px;
      border-radius:50%;
      background:rgba(255,255,255,.72);
      box-shadow:0 0 10px rgba(255,255,255,.52);
      pointer-events:none;
      z-index:0;
    }

    .spark-one{
      right:48px;
      bottom:18px;
    }

    .spark-two{
      left:44px;
      bottom:28px;
      width:3px;
      height:3px;
      opacity:.75;
    }

    .candle-content{
      position:relative;
      z-index:1;
    }

    @media (max-width:760px){
      .page{
        width:min(100% - 22px, 640px);
        padding-top:34px;
      }

      .deck{
        max-width:100%;
      }

      .candle{
        grid-template-columns:1fr;
      }

      .appointment{
        min-height:72px;
        border-radius:20px;
        padding:13px 16px;
      }

      .appointment-copy strong{
        font-size:16px;
      }

      .appointment-copy small{
        font-size:11px;
      }


      .hero{
        margin-bottom:20px;
      }

      .brand-logo{
        width:28px;
        height:28px;
      }

      .brand-badge{
        font-size:13px;
      }

      .hero p{
        font-size:13px;
        padding:0;
      }

      .deck{
        gap:10px;
        margin-top:28px;
      }

      .pick-label{
        font-size:11px;
        margin-bottom:8px;
      }

      .tarot-card{
        border-radius:17px;
      }

      .card-face{
        border-radius:17px;
      }

      .card-back::before{inset:7px;border-radius:13px}
      .card-back::after{inset:14px;border-radius:10px}

      .sigil{
        width:60px;
        height:60px;
        font-size:27px;
      }

      .sigil::before{width:42px;height:42px;border-radius:7px}
      .sigil::after{width:28px;height:28px}

      .card-front{
        padding:8px;
      }

      .front-inner{
        padding:10px 6px;
        border-radius:11px;
      }

      .front-top{font-size:7px}
      .front-symbol{
        width:54px;
        height:54px;
        font-size:28px;
      }
      .front-title{font-size:14px}
      .front-sub{font-size:8px}

      .reading{
        padding:23px 20px 21px;
      }

      .reading h2{
        font-size:20px;
      }

      .reading p{
        font-size:14px;
        line-height:1.9;
      }

      .candle{
        grid-template-columns:1fr;
        text-align:center;
        padding:20px;
      }
    }


    @media (max-width:760px){
      body{
        background-attachment:scroll;
      }

      .page{
        width:min(100% - 18px, 560px);
        padding:26px 0 48px;
      }

      .hero h1{
        font-size:clamp(21px, 6vw, 30px);
        line-height:1.55;
        letter-spacing:.06em;
      }

      .hero h1::after{
        width:48px;
        margin-top:12px;
      }

      .hero-intro{
        max-width:100%;
        margin-top:15px;
        gap:11px;
      }

      .hero p{
        margin:0;
        font-size:12.5px;
        line-height:1.95;
        letter-spacing:.035em;
      }

      .brand-badge{
        min-width:194px;
        padding:4px 19px;
        gap:11px;
        font-size:12px;
      }

      .brand-logo{
        width:22px;
        height:22px;
      }

      .brand-name{
        padding-left:11px;
      }

      .brand-mark{
        width:11px;
        height:11px;
      }

      /* 手機維持三張並排，未翻牌高度由 144px 加倍為 288px。 */
      .deck{
        width:100%;
        grid-template-columns:repeat(3, minmax(0,1fr));
        gap:7px;
        margin-top:22px;
      }

      .card-wrap{
        min-width:0;
      }

      .pick-label{
        margin-bottom:7px;
        font-size:10px;
      }

      .tarot-card{
        width:100%;
        max-width:none;
        height:288px;
        border-radius:14px;
      }

      .card-face{
        border-radius:14px;
      }

      .card-back::before{
        inset:5px;
        border-radius:10px;
      }

      .card-back::after{
        inset:10px;
        border-radius:8px;
      }

      .sigil{
        width:46px;
        height:46px;
        font-size:22px;
      }

      .sigil::before{
        width:32px;
        height:32px;
        border-radius:6px;
      }

      .sigil::after{
        width:21px;
        height:21px;
      }

      .front-inner{
        padding:9px 4px;
      }

      .front-symbol{
        width:45px;
        height:45px;
        font-size:23px;
      }

      .front-title{
        font-size:13px;
      }

      .front-sub{
        font-size:7px;
      }

      .deck.has-selection{
        width:min(62vw, 245px);
        max-width:245px;
        grid-template-columns:1fr;
      }

      .deck.has-selection .card-wrap.is-selected .tarot-card{
        width:100%;
        max-width:245px;
        height:auto;
      }

      .result{
        margin-top:24px;
      }

      .reading{
        padding:22px 17px 19px;
      }

      .reading h2{
        font-size:19px;
      }

      .reading p{
        font-size:13px;
        line-height:1.85;
      }

      .candle{
        padding:25px 17px 18px;
        text-align:left;
      }

      .candle-recommend-label{
        top:12px;
        left:14px;
        font-size:10px;
      }

      .candle-content h3{
        font-size:17px;
      }

      .candle-content p{
        font-size:13px;
      }

      .appointment-wrap{
        margin-top:22px;
      }

      .appointment{
        width:100%;
        min-height:68px;
        padding:12px 14px;
        gap:11px;
      }

      .appointment-icon{
        width:34px;
        height:34px;
      }

      .appointment-copy strong{
        font-size:15px;
      }

      .appointment-copy small{
        font-size:10.5px;
      }

      button.reset{
        padding:6px 11px;
        font-size:11px;
      }
    }

    @media (max-width:380px){
      /* 小螢幕未翻牌高度由 126px 加倍為 252px。 */
      .tarot-card{
        height:252px;
      }

      .page{
        width:calc(100% - 12px);
      }

      .deck{
        gap:5px;
      }

      .sigil{
        width:40px;
        height:40px;
        font-size:19px;
      }

      .sigil::before{
        width:28px;
        height:28px;
      }

      .sigil::after{
        width:18px;
        height:18px;
      }
    }

    @media (prefers-reduced-motion: reduce){
      *{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        scroll-behavior:auto !important;
        transition-duration:.001ms !important;
      }
    }
  </style>
</head>

          "而審判牌是這組牌最重要的轉折，代表你們近期會開始重新檢視這段關係，思考彼此到底要停留在現在，還是真的往下一步發展。",

        ],
        candle: "淨化蠟燭",
        candleText: "適合用在關係裡累積了焦慮、壓力或反覆拉扯的時候。重點不是強求結果，而是先把混亂感沉澱下來，讓自己更清楚真正想要什麼。"
      },
      C: {
        title: "C選項",
        paragraphs: [
          "以目前的相處方式來看，你們短期內比較難直接更進一步，因為這段關係其實已經走到需要改變的階段。",
          "死神牌的出現，表示你們原本的相處模式開始不再那麼適合你們，如果還想繼續發展，就不能再維持現在忽近忽遠、沒有明確方向的狀態，而是需要重新調整彼此的位置。",

        candleText: "適合用在關係忽近忽遠、想修復連結與重新靠近的時候。讓儀式感聚焦在整理未說出口的情緒、修復溝通與調整舊有的相處模式，陪伴你以更清楚、穩定的心意面對這段關係。"

    const deck = document.getElementById("deck");
    const result = document.getElementById("result");
    const hint = document.getElementById("hint");
    const resetBtn = document.getElementById("resetBtn");
    const cards = [...document.querySelectorAll(".card-wrap")];

    let resultScrollTimer;

    function selectCard(choice){
      if(deck.classList.contains("has-selection")) return;

      const target = cards.find(el => el.dataset.choice === choice);
      if(!target) return;

      deck.classList.add("has-selection");
      target.classList.add("is-selected");
      const selectedCard = target.querySelector(".tarot-card");
      selectedCard.classList.add("flipped");
      selectedCard.setAttribute("aria-pressed", "true");

      const data = readings[choice];
      document.getElementById("resultKicker").textContent = `YOUR READING · ${choice}`;
      document.getElementById("resultTitle").textContent = data.title;
      const resultText = document.getElementById("resultText");
      resultText.textContent = "";
      data.paragraphs.forEach(text => {
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        resultText.appendChild(paragraph);
      });
      document.getElementById("candleTitle").textContent = data.candle;
      document.getElementById("candleText").textContent = data.candleText;

      hint.textContent = `你選擇了 ${choice}`;
      result.classList.add("show");

      resultScrollTimer = setTimeout(() => {
        result.scrollIntoView({behavior:"smooth", block:"start"});
      }, 650);
    }

    cards.forEach(wrap => {
      const card = wrap.querySelector(".tarot-card");
      card.addEventListener("click", () => selectCard(wrap.dataset.choice));
    });

    resetBtn.addEventListener("click", () => {
      clearTimeout(resultScrollTimer);
      deck.classList.remove("has-selection");
      cards.forEach(wrap => {
        wrap.classList.remove("is-selected");
        const card = wrap.querySelector(".tarot-card");
        card.classList.remove("flipped");
        card.setAttribute("aria-pressed", "false");
      });
      result.classList.remove("show");
      result.style.removeProperty("display");
      hint.textContent = "點選一張牌查看你的解析";
      window.scrollTo({top:0, behavior:"smooth"});
    });

    const snow = document.getElementById("snow");
    const flakes = 42;

    for(let i=0;i<flakes;i++){
      const dot = document.createElement("span");
      dot.className = "snowflake";
      const size = Math.random() * 6 + 2;
      const left = Math.random() * 100;
      const duration = Math.random() * 10 + 10;
      const delay = Math.random() * -20;
      const drift = (Math.random() * 90 - 45) + "px";

      dot.style.width = size + "px";
      dot.style.height = size + "px";
      dot.style.left = left + "%";
      dot.style.animationDuration = duration + "s";
      dot.style.animationDelay = delay + "s";
      dot.style.setProperty("--drift", drift);
      dot.style.opacity = Math.random() * .55 + .25;

      snow.appendChild(dot);
    }
  </script>
</body>
